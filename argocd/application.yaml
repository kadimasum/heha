apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kadimasum/heha.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
